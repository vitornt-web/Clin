<!DOCTYPE html>

<!-- Flash popup centralizado -->
#{if flash.success}
<div id="flashPopup" class="popup-flash show bg-success text-white">
  <div class="popup-content text-center p-4 rounded">
    <p class="mb-0">${flash.success}</p>
  </div>
</div>
#{/if}

#{if flash.error}
<div id="flashPopup" class="popup-flash show bg-danger text-white">
  <div class="popup-content text-center p-4 rounded">
    <p class="mb-0">${flash.error}</p>
  </div>
</div>
#{/if}

<html>
    <head>
        <title>#{get 'title' /}</title>
        <meta charset="${_response_encoding}">
        <link rel="stylesheet" media="screen" href="@{'/public/stylesheets/css/main.css'}">
        #{get 'moreStyles' /}
        <link rel="shortcut icon" type="image/png" href="@{'/public/images/img/favicon.png'}">
    </head>
    <body>
        #{doLayout /}
        
        <script src="@{'/public/javascripts/js/main.js'}" type="text/javascript" charset="${_response_encoding}"></script>
        #{get 'moreScripts' /}
    </body>
</html>
